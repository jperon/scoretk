[package]
name = "scoretk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CLI scoretk : conversion de partitions entre formats"
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "scoretk"
path = "src/main.rs"

[dependencies]
# Les quatre convertisseurs sont branchés par défaut dans la CLI : lecture
# MusicXML (`musicxml-import`), écriture MIDI (`midi`), MuseScore
# (`.mscx`/`.mscz`, `mscx`) et LilyPond (`lilypond`). Ainsi
# `scoretk entrée.musicxml -o sortie.mscx`, `… -o sortie.ly` et
# `scoretk entrée.mscx -o sortie.mid` fonctionnent sans option de compilation.
scoretk = { path = "../scoretk", features = ["musicxml-import", "midi", "lilypond", "mscx"] }
clap = { workspace = true }

[dev-dependencies]
mscz2xml = { path = "../mscz2xml" }
zip = { workspace = true }
