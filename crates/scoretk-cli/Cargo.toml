[package]
name = "scoretk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CLI scoretk : conversion de partitions entre formats"
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "scoretk"
path = "src/main.rs"

[dependencies]
# Les six convertisseurs sont branchés par défaut dans la CLI : lecture
# MusicXML (`musicxml-import`), lecture LilyPond (`lilypond-import`), lecture
# et écriture ABC (`abc`), écriture MIDI (`midi`), MuseScore
# (`.mscx`/`.mscz`, `mscx`) et écriture LilyPond (`lilypond`). Ainsi
# `scoretk entrée.musicxml -o sortie.mscx`, `… -o sortie.ly`,
# `… -o sortie.mid` et `… -o sortie.abc` fonctionnent sans option de
# compilation, et `scoretk entrée.ly -o sortie.musicxml` lit le sous-ensemble
# LilyPond.
scoretk = { path = "../scoretk", features = ["musicxml-import", "midi", "lilypond", "lilypond-import", "mscx", "abc"] }
clap = { workspace = true }

[dev-dependencies]
mscz2xml = { path = "../mscz2xml" }
zip = { workspace = true }
