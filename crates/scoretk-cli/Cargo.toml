[package]
name = "scoretk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CLI scoretk : conversion de partitions entre formats"
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "scoretk"
path = "src/main.rs"

[dependencies]
# Les dix convertisseurs sont branchés par défaut dans la CLI : une feature par
# crate de sens (`docs/agents/scoretk.md` § 3), sans alias mixte. Ainsi
# `scoretk entrée.musicxml -o sortie.mscx`, `… -o sortie.ly`,
# `… -o sortie.mid` et `… -o sortie.abc` fonctionnent sans option de
# compilation, et `scoretk entrée.ly -o sortie.musicxml` lit le sous-ensemble
# LilyPond.
scoretk = { path = "../scoretk", features = [
    "musescore-import",
    "musescore-export",
    "musicxml-import",
    "musicxml-export",
    "midi-import",
    "midi-export",
    "lilypond-import",
    "lilypond-export",
    "abc-import",
    "abc-export",
    "gabc-import",
    "gabc-export",
    "engrave",
] }
clap = { workspace = true }
# Facultatif, gate par la feature `memory-report` : hors de la compilation
# habituelle et des binaires distribués (docs/agents/engraving.md,
# "Resource budget (Kobo Mini)").
dhat = { version = "0.3.2", optional = true }

[dev-dependencies]
scoretk-musescore-import = { path = "../scoretk-musescore-import" }
scoretk-musicxml-export = { path = "../scoretk-musicxml-export" }
zip = { workspace = true }

[features]
# Outillage de mesure uniquement : dhat n'entre ni dans la compilation
# habituelle ni dans les binaires distribués (docs/agents/engraving.md,
# "Resource budget (Kobo Mini)").
memory-report = ["dep:dhat"]
