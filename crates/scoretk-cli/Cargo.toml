[package]
name = "scoretk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CLI scoretk : conversion de partitions entre formats"
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "scoretk"
path = "src/main.rs"

[dependencies]
# L'écriture LilyPond est branchée par défaut dans la CLI : `scoretk
# entrée.mscz -o sortie.ly` fonctionne sans option de compilation.
scoretk = { path = "../scoretk", features = ["lilypond"] }
clap = { workspace = true }

[dev-dependencies]
mscz2xml = { path = "../mscz2xml" }
zip = { workspace = true }
