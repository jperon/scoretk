[package]
name = "scoretk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CLI scoretk : conversion de partitions entre formats"
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "scoretk"
path = "src/main.rs"

[dependencies]
# Les écrivains MuseScore (`.mscx`/`.mscz`) et LilyPond sont branchés par
# défaut dans la CLI : `scoretk entrée.mscz -o sortie.ly` et
# `scoretk entrée.musicxml -o sortie.mscx` fonctionnent sans option de
# compilation.
scoretk = { path = "../scoretk", features = ["lilypond", "mscx"] }
clap = { workspace = true }

[dev-dependencies]
mscz2xml = { path = "../mscz2xml" }
zip = { workspace = true }
