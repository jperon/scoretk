[package]
name = "scoretk"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Façade de conversion de partitions : lecture et écriture par format"
repository.workspace = true
homepage.workspace = true

[features]
# Douze features symétriques, une par crate de sens : `<format>-import` branche
# la lecture, `<format>-export` l'écriture. Aucun alias mixte : un besoin des
# deux sens liste les deux features (comme la CLI et le crate wasm).
default = [
    "musescore-import",
    "musescore-export",
    "musicxml-import",
    "musicxml-export",
    "midi-import",
    "midi-export",
    "lilypond-import",
    "lilypond-export",
    "abc-import",
    "abc-export",
    "mei-import",
    "mei-export",
    "gabc-import",
    "gabc-export",
]

# Points d'accroche des convertisseurs optionnels. Tant qu'une feature est
# désactivée, le format correspondant renvoie `Error::FormatNonPrisEnCharge`
# dans ce sens. Le branchement se fait dans `src/hooks.rs` ; la procédure
# complète est dans `docs/agents/scoretk.md` § 3.
musescore-import = ["dep:scoretk-musescore-import"]
musescore-export = ["dep:scoretk-musescore-export"]
musicxml-import = ["dep:scoretk-musicxml-import"]
musicxml-export = ["dep:scoretk-musicxml-export"]
midi-import = ["dep:scoretk-midi-import"]
midi-export = ["dep:scoretk-midi-export"]
lilypond-import = ["dep:scoretk-lilypond-import"]
lilypond-export = ["dep:scoretk-lilypond-export"]
abc-import = ["dep:scoretk-abc-import"]
abc-export = ["dep:scoretk-abc-export"]
mei-import = ["dep:scoretk-mei-import"]
mei-export = ["dep:scoretk-mei-export"]
gabc-import = ["dep:scoretk-gabc-import", "dep:scoretk-gabc-common"]
gabc-export = ["dep:scoretk-gabc-export"]
# Gravure P1 (désactivée par défaut et dans le paquet wasm) : une seule portée,
# sortie SVG. Aucune feature n'est activée par les autres formats.
engrave = ["dep:scoretk-engrave", "dep:scoretk-render-svg"]

[dependencies]
scoretk-core = { path = "../scoretk-core" }
scoretk-musescore-import = { path = "../scoretk-musescore-import", optional = true }
scoretk-musescore-export = { path = "../scoretk-musescore-export", optional = true }
scoretk-musicxml-import = { path = "../scoretk-musicxml-import", optional = true }
scoretk-musicxml-export = { path = "../scoretk-musicxml-export", optional = true }
scoretk-midi-import = { path = "../scoretk-midi-import", optional = true }
scoretk-midi-export = { path = "../scoretk-midi-export", optional = true }
scoretk-lilypond-import = { path = "../scoretk-lilypond-import", optional = true }
scoretk-lilypond-export = { path = "../scoretk-lilypond-export", optional = true }
scoretk-abc-import = { path = "../scoretk-abc-import", optional = true }
scoretk-abc-export = { path = "../scoretk-abc-export", optional = true }
scoretk-mei-import = { path = "../scoretk-mei-import", optional = true }
scoretk-mei-export = { path = "../scoretk-mei-export", optional = true }
scoretk-gabc-import = { path = "../scoretk-gabc-import", optional = true }
scoretk-gabc-common = { path = "../scoretk-gabc-common", optional = true }
scoretk-gabc-export = { path = "../scoretk-gabc-export", optional = true }
scoretk-engrave = { path = "../scoretk-engrave", optional = true }
scoretk-render-svg = { path = "../scoretk-render-svg", optional = true }
thiserror = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
# Les tests d'aller-retour comparent les deux sens d'un même format : ils
# vivent dans la façade et dépendent donc des crates de sens directement.
# Le test de couverture mesure les douze déclarations de capacités : il a
# besoin de toutes les crates de sens, sans affecter les dépendances de la
# bibliothèque ni le contrat wasm.
scoretk-musescore-import = { path = "../scoretk-musescore-import" }
scoretk-musescore-export = { path = "../scoretk-musescore-export" }
scoretk-musicxml-import = { path = "../scoretk-musicxml-import" }
scoretk-musicxml-export = { path = "../scoretk-musicxml-export" }
scoretk-midi-import = { path = "../scoretk-midi-import" }
scoretk-midi-export = { path = "../scoretk-midi-export" }
scoretk-lilypond-import = { path = "../scoretk-lilypond-import" }
scoretk-lilypond-export = { path = "../scoretk-lilypond-export" }
scoretk-abc-import = { path = "../scoretk-abc-import" }
scoretk-abc-export = { path = "../scoretk-abc-export" }
scoretk-mei-import = { path = "../scoretk-mei-import" }
scoretk-mei-export = { path = "../scoretk-mei-export" }
scoretk-mei-common = { path = "../scoretk-mei-common" }
scoretk-xml-common = { path = "../scoretk-xml-common" }
scoretk-gabc-import = { path = "../scoretk-gabc-import" }
scoretk-gabc-export = { path = "../scoretk-gabc-export" }
scoretk-gabc-common = { path = "../scoretk-gabc-common" }
quick-xml = { workspace = true }
# Test d'identité entre les têtes de notes gravées et la carte des temps.
scoretk-engrave = { path = "../scoretk-engrave" }
# Oracle SMF indépendant de l'importeur : lit les bytes écrits avec `midly`.
midly = { version = "0.5.3", default-features = false, features = ["alloc", "std"] }
similar = "3"
zip = { workspace = true }
# Banc de performance natif (`benches/conversion.rs`). Pas de plotters, pas de
# HTML, pas de rayon : seuls les rapports texte et l'intégration `cargo bench`
# sont utiles ici (voir `docs/agents/performance.md`).
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "conversion"
harness = false
