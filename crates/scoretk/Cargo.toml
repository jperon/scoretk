[package]
name = "scoretk"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Façade de conversion de partitions : lecture et écriture par format"
repository.workspace = true
homepage.workspace = true

[features]
default = []

# Points d'accroche des convertisseurs optionnels. Tant qu'ils sont désactivés,
# le format correspondant renvoie `Error::FormatNonPrisEnCharge`. Pour brancher
# une crate, voir `docs/agents/scoretk.md` § 3 : ajouter la dépendance
# optionnelle et remplacer la valeur du feature ci-dessous.
#
musicxml-import = ["dep:scoretk-musicxml"]
midi = ["dep:scoretk-midi"]
mscx = ["dep:scoretk-mscx"]

[dependencies]
mscz2xml = { path = "../mscz2xml" }
scoretk-mscx = { path = "../scoretk-mscx", optional = true }
scoretk-midi = { path = "../scoretk-midi", optional = true }
scoretk-musicxml = { path = "../scoretk-musicxml", optional = true }
thiserror = { workspace = true }
zip = { workspace = true }
