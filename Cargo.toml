[workspace]
resolver = "2"
members = [
    "crates/scoretk-core",
    "crates/scoretk-xml-common",
    "crates/scoretk-musescore-import",
    "crates/scoretk-musescore-export",
    "crates/scoretk-musicxml-import",
    "crates/scoretk-musicxml-export",
    "crates/scoretk-midi-common",
    "crates/scoretk-midi-import",
    "crates/scoretk-midi-export",
    "crates/scoretk-lilypond-common",
    "crates/scoretk-lilypond-import",
    "crates/scoretk-lilypond-export",
    "crates/scoretk-abc-common",
    "crates/scoretk-abc-import",
    "crates/scoretk-abc-export",
    "crates/scoretk-mei-common",
    "crates/scoretk-mei-import",
    "crates/scoretk-mei-export",
    "crates/scoretk-gabc-common",
    "crates/scoretk-gabc-import",
    "crates/scoretk-gabc-export",
    "crates/scoretk",
    "crates/scoretk-cli",
    "crates/scoretk-wasm",
    "crates/scoretk-render-raster",
    "crates/scoretk-smufl",
    "crates/scoretk-engrave",
    "crates/scoretk-render-svg",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["jperon"]
description = "Portage Rust de l'export MusicXML de MuseScore"
repository = "https://github.com/jperon/scoretk"
homepage = "https://github.com/jperon/scoretk"

[workspace.dependencies]
zip = { version = "2.6.1", default-features = false, features = ["deflate-flate2", "flate2"] }
# Fournit le backend DEFLATE à zip (feature deflate-flate2) sans tirer zopfli :
# rust_backend de flate2 repose sur miniz_oxide (pur Rust), pas sur zlib C.
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
quick-xml = "0.42"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# Host CLI and libraries: optimise for build time (measured on 2026-11-27;
# see docs/agents/developpement.md, "Cargo profiles"). Runtime cost is
# negligible on the corpus; the browser package has its own profile below.
[profile.release]
lto = false
opt-level = 1
codegen-units = 16

# Identical to the former release profile: the wasm binary is downloaded by
# the PWA, so it keeps the size settings (and stays byte-identical).
[profile.wasm]
inherits = "release"
lto = true
opt-level = "z"
codegen-units = 1
