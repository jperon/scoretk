[workspace]
resolver = "2"
members = ["crates/mscz2xml", "crates/mscz2xml-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["mscz2xml contributors"]
description = "Portage Rust de l'export MusicXML de MuseScore"

[workspace.dependencies]
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
