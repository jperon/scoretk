[workspace]
resolver = "2"
members = [
    "crates/mscz2xml",
    "crates/mscz2xml-cli",
    "crates/mscz2xml-wasm",
    "crates/scoretk",
    "crates/scoretk-cli",
    "crates/scoretk-midi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["jperon"]
description = "Portage Rust de l'export MusicXML de MuseScore"
repository = "https://github.com/jperon/scoretk"
homepage = "https://github.com/jperon/scoretk"

[workspace.dependencies]
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
# Le paquet navigateur vise la taille (wasm téléchargé par la PWA) ; pour la
# CLI, le coût est négligeable.
opt-level = "z"
codegen-units = 1
