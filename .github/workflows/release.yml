# Copyright (C) 2026 jperon
#
# Two release modes:
#   - v* tag: normal release, generated notes, name = tag;
#   - push to master: rolling "nightly" release, moving tag,
#     prerelease, old assets removed (concurrency: one run at a time).
# Nothing is pushed from the workstation: publishing a version is done with
# `git tag v… && git push origin v…` (see docs/agents/developpement.md).

name: Releases

on:
  push:
    branches: [master]
    tags: ['v*']

# The rolling release cancels the previous run; each v* tag has its own group.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  meta:
    name: Version and exact source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      nightly: ${{ steps.compute.outputs.nightly }}
      source_url: ${{ steps.compute.outputs.source_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute version
        id: compute
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
            nightly=false
            source_url="https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME"
          else
            # Version from Cargo.toml, suffixed for the rolling release: the Rust
            # code is not modified (see the "Releases" section of the docs).
            base=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
            short="${GITHUB_SHA:0:7}"
            day=$(date -u +%Y%m%d)
            version="${base}-nightly.${day}.${short}"
            nightly=true
            source_url="https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA"
          fi
          {
            echo "version=$version"
            echo "nightly=$nightly"
            echo "source_url=$source_url"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version, nightly=$nightly, source=$source_url"

  cli:
    name: CLI ${{ matrix.target }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
            archive: tar.gz
          - runner: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            archive: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            ext: ""
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            archive: zip
    # The default `run` shell is PowerShell on Windows, where "$TARGET" is not
    # the environment variable (that would be "$env:TARGET"): one bash shell for
    # the whole job (Git Bash ships on the Windows runners); the steps needing
    # PowerShell declare `shell: pwsh` themselves.
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: musl tools (static Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Rust target
        if: matrix.target != 'x86_64-unknown-linux-musl'
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      # Native CLI release uses the host [profile.release] (lto = false,
      # codegen-units = 16, opt-level = 1). This does not affect cross builds:
      # the musl, macOS and Windows binaries all share the same profile.
      - name: Build the CLI
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p scoretk-cli --target "$TARGET"

      # GPL §5/§6 obligations: licence, notices, README and the address of the
      # corresponding source for the exact version (tag or nightly commit).
      - name: Archive contents
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          VERSION: ${{ needs.meta.outputs.version }}
          SOURCE_URL: ${{ needs.meta.outputs.source_url }}
        run: |
          set -euo pipefail
          mkdir -p staging dist
          cp "target/$TARGET/release/scoretk$EXT" staging/
          cp LICENSE NOTICE README.md staging/
          {
            printf 'scoretk %s (%s)\n' "$VERSION" "$TARGET"
            printf 'Corresponding source (exact version): %s\n' "$SOURCE_URL"
            printf 'License: GPL-3.0-only. Distributed WITHOUT ANY WARRANTY.\n'
          } > staging/SOURCES.txt
          ls -l staging

      - name: .tar.gz archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          tar -czf "dist/scoretk-${VERSION}-${TARGET}.tar.gz" \
            -C staging scoretk LICENSE NOTICE README.md SOURCES.txt

      - name: .zip archive
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Force -Path staging/* `
            -DestinationPath "dist/scoretk-${env:VERSION}-${env:TARGET}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  wasm:
    name: wasm package
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by magic-nix-cache-action for the GitHub Actions cache.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v15

      # The browser package selects CARGO_PROFILE=wasm: the separate size
      # profile keeps the wasm binary unchanged.
      - name: Build the package
        run: nix build .#wasm

      - name: npm package and GPL notice
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          SOURCE_URL: ${{ needs.meta.outputs.source_url }}
        run: |
          set -euo pipefail
          mkdir -p dist work
          cp -R result/. work/
          chmod -R u+w work
          # The npm package name stays `scoretk` (cantus contract); only the
          # package.json version follows the release (`v` removed for npm).
          # `files` is an allowlist: add SOURCES.txt, otherwise the GPL notice
          # about the exact source would be missing from the .tgz.
          npm_version="${VERSION#v}"
          (cd work && npm pkg set version="$npm_version" 'files[]=SOURCES.txt')
          {
            printf 'scoretk %s (wasm32-unknown-unknown)\n' "$VERSION"
            printf 'Corresponding source (exact version): %s\n' "$SOURCE_URL"
            printf 'License: GPL-3.0-only. Distributed WITHOUT ANY WARRANTY.\n'
          } > work/SOURCES.txt
          (cd work && npm pack --pack-destination ../dist)
          mv dist/scoretk-*.tgz "dist/scoretk-${VERSION}-wasm.tgz"
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: dist/*
          if-no-files-found: error

  publication:
    name: Publish the release
    needs: [meta, cli, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          list=$(mktemp)
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort > "$list"
          while IFS= read -r file; do sha256sum "$file"; done < "$list" > SHA256SUMS
          rm "$list"
          cat SHA256SUMS

      - name: Move the rolling nightly tag
        if: needs.meta.outputs.nightly == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly
          git push --force origin refs/tags/nightly

      - name: Delete old nightly assets
        if: needs.meta.outputs.nightly == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old=$(gh release view nightly --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' 2>/dev/null || true)
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            gh release delete-asset nightly "$asset" --repo "$GITHUB_REPOSITORY" --yes
          done <<< "$old"

      - name: Nightly release (prerelease)
        if: needs.meta.outputs.nightly == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: nightly
          prerelease: true
          generate_release_notes: false
          overwrite_files: true
          files: artifacts/*

      - name: Version release
        if: needs.meta.outputs.nightly != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
